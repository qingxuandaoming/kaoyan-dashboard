<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早间回顾与复习</title>
  <style>
    :root {
      --bg: #f4f6f8; --card-bg: #ffffff; --text: #1a1a2e; --text-muted: #6c757d;
      --accent: #2563eb; --accent-light: #dbeafe; --accent-red: #dc2626; --accent-red-light: #fee2e2;
      --accent-green: #16a34a; --accent-green-light: #dcfce7; --accent-amber: #d97706; --accent-amber-light: #fef3c7;
      --border: #e5e7eb; --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", "Fira Code", Consolas, monospace;
      --sidebar-width: 280px; --sidebar-collapsed: 60px;
      --sidebar-bg: #ffffff; --sidebar-border: #e5e7eb;
      --sidebar-active: #eff6ff; --sidebar-active-border: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans); background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
    }

    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width); background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border); position: fixed;
      top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column;
      transition: width 0.3s ease, transform 0.3s ease;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    .sidebar-header {
      padding: 18px 16px 12px; border-bottom: 1px solid var(--sidebar-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding: 18px 8px 12px; }
    .sidebar-header .logo { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
    .sidebar.collapsed .logo span { display: none; }
    .sidebar-header .logo-icon {
      width: 28px; height: 28px; background: linear-gradient(135deg, #1a1a2e, #2563eb);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 0.75rem; flex-shrink: 0;
    }
    .sidebar-toggle {
      background: none; border: none; cursor: pointer; font-size: 1rem;
      color: var(--text-muted); padding: 4px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: background 0.15s;
    }
    .sidebar-toggle:hover { background: #f1f5f9; }
    .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 12px 0; }
    .sidebar.collapsed .sidebar-body { display: none; }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Check-in Area */
    .checkin-area { padding: 12px 16px; border-bottom: 1px solid var(--sidebar-border); }
    .checkin-area .stats { display: flex; gap: 12px; margin-bottom: 10px; }
    .checkin-area .stat-box { flex: 1; text-align: center; padding: 8px; background: #f8fafc; border-radius: 8px; }
    .checkin-area .stat-box .num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .checkin-area .stat-box .label { font-size: 0.7rem; color: var(--text-muted); }
    .checkin-btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
      background: var(--accent); color: white;
    }
    .checkin-btn:hover { background: #1d4ed8; }
    .checkin-btn.checked { background: var(--accent-green); }
    .checkin-btn.checked:hover { background: #15803d; }

    /* Calendar */
    .calendar-wrap { padding: 12px 16px; border-bottom: 1px solid var(--sidebar-border); }
    .calendar-wrap .cal-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .calendar-wrap .cal-nav { display: flex; gap: 4px; }
    .calendar-wrap .cal-nav button { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.85rem; padding: 2px 6px; border-radius: 4px; }
    .calendar-wrap .cal-nav button:hover { background: #f1f5f9; color: var(--text); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-grid .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-radius: 6px; cursor: pointer; position: relative; color: var(--text-muted); }
    .calendar-grid .cal-cell:hover { background: #f1f5f9; }
    .calendar-grid .cal-cell.other { color: #cbd5e1; }
    .calendar-grid .cal-cell.today { background: var(--accent-light); color: var(--accent); font-weight: 700; }
    .calendar-grid .cal-cell.studied::after { content: ''; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 0 2px var(--accent-green-light); }
    .calendar-grid .cal-cell.checked::after { content: ''; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-amber); box-shadow: 0 0 0 2px var(--accent-amber-light); }

    /* History Panel */
    .history-panel { padding: 12px 16px; }
    .history-panel .hp-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .history-panel .hp-list { display: flex; flex-direction: column; gap: 6px; }
    .history-panel .hp-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.15s; font-size: 0.8rem; color: var(--text-muted);
    }
    .history-panel .hp-item:hover { background: #f8fafc; }
    .history-panel .hp-item.active { background: var(--sidebar-active); color: var(--accent); font-weight: 600; }
    .history-panel .hp-item .hp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .history-panel .hp-item .hp-dot.green { background: var(--accent-green); }
    .history-panel .hp-item .hp-dot.gray { background: #cbd5e1; }
    .history-panel .hp-item .hp-date { flex-shrink: 0; width: 60px; }
    .history-panel .hp-item .hp-subj { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--sidebar-border);
      font-size: 0.75rem; color: var(--text-muted); text-align: center; }
    .sidebar.collapsed .sidebar-footer span { display: none; }
    .sidebar.collapsed .sidebar-footer::after { content: '©'; }

    .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35); z-index: 99; }
    .overlay.show { display: block; }

    /* Main */
    .main { margin-left: var(--sidebar-width); flex: 1; padding: 20px; min-height: 100vh; transition: margin-left 0.3s ease; }
    .main.expanded { margin-left: var(--sidebar-collapsed); }
    .topbar { display: none; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .menu-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center;
      gap: 6px; color: var(--text); font-family: inherit; }

    .container { max-width: 800px; margin: 0 auto; }

    header { text-align: center; padding: 40px 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white;
      border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    header::before { content: "; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 60%); pointer-events: none; }
    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; position: relative; }
    header .date { font-size: 0.95rem; opacity: 0.75; margin-top: 8px; font-weight: 400; position: relative; }
    header .tag { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 14px;
      border-radius: 20px; font-size: 0.75rem; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase; position: relative; }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 28px; margin-bottom: 20px;
      box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); scroll-margin-top: 24px; }
    .card:hover { box-shadow: var(--shadow-hover); }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
    .card-title .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; margin-right: 6px; }
    .badge-blue { background: var(--accent-light); color: var(--accent); }
    .badge-red { background: var(--accent-red-light); color: var(--accent-red); }
    .badge-green { background: var(--accent-green-light); color: var(--accent-green); }
    .badge-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
    .badge-purple { background: #ede9fe; color: #7c3aed; }
    .badge-cyan { background: #cffafe; color: #0891b2; }

    .review-item { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px dashed var(--border); }
    .review-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .review-item h4 { font-size: 0.95rem; color: var(--accent); margin-bottom: 8px; }
    .review-item p, .review-item li { font-size: 0.9rem; color: var(--text-muted); line-height: 1.8; }
    .review-item ul { padding-left: 18px; }
    .review-item .conclusion { background: var(--accent-light); color: var(--accent); padding: 10px 14px;
      border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin: 8px 0; border-left: 3px solid var(--accent); }
    .review-item .note-link { margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .review-item .note-link a { color: var(--accent); text-decoration: none; }
    .review-item .note-link a:hover { text-decoration: underline; }
    .review-item .note-link .copy-btn { background: #f1f5f9; border: none; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; color: var(--text-muted); }
    .review-item .note-link .copy-btn:hover { background: #e2e8f0; }

    .quiz-item { margin-bottom: 16px; padding: 16px; background: #fafafa; border-radius: 8px; border: 1px solid var(--border); }
    .quiz-item .q { font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; color: var(--text); }
    .quiz-item .q-num { display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; background: var(--accent); color: white; border-radius: 50%;
      font-size: 0.75rem; font-weight: 700; margin-right: 8px; flex-shrink: 0; }
    .answer-box { display: none; margin-top: 12px; padding: 14px; background: var(--accent-green-light);
      border-left: 3px solid var(--accent-green); border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #14532d; line-height: 1.8; }
    .answer-box.show { display: block; }
    .answer-box .note-link { margin-top: 10px; font-size: 0.8rem; color: #14532d; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .answer-box .note-link a { color: #14532d; text-decoration: underline; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-reveal { background: white; color: var(--accent); border: 1px solid var(--accent); }
    .btn-reveal:hover { background: var(--accent-light); }
    .btn-reveal-all { background: var(--accent-amber-light); color: var(--accent-amber); border: 1px solid var(--accent-amber); margin-bottom: 16px; }
    .btn-reveal-all:hover { background: #fef3c7; }

    .english-section .sentence-box { background: #1e293b; color: #e2e8f0; padding: 20px; border-radius: 10px;
      font-size: 1rem; line-height: 2; margin-bottom: 20px; overflow-x: auto; }
    .english-section .sentence-box .hl-red { color: #fca5a5; font-weight: 600; }
    .english-section .sentence-box .hl-blue { color: #93c5fd; font-weight: 600; }
    .english-section .sentence-box .hl-amber { color: #fcd34d; font-weight: 600; }
    .english-section .sentence-box .hl-green { color: #86efac; font-weight: 600; }
    .english-section .translation {
      display: none; margin-bottom: 20px; background: #f0f9ff; border-left: 3px solid #0ea5e9; padding: 14px 16px;
      border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #0c4a6e; line-height: 1.8;
    }
    .english-section .translation.show { display: block; }

    .table-wrap { overflow-x: auto; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 600; color: var(--text); font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text-muted); }
    tr:hover td { background: #fafafa; }

    .grammar-point { margin-bottom: 14px; padding: 14px; background: #fafafa; border-radius: 8px; border: 1px solid var(--border); }
    .grammar-point .gp-title { font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px; }
    .grammar-point .gp-title .num { display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; background: var(--accent); color: white; border-radius: 50%;
      font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
    .grammar-point p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; }
    .grammar-point code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.8rem; color: #334155; }

    .structure-tree { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.8; overflow-x: auto; white-space: pre; margin-bottom: 16px; }

    /* Math Section */
    .math-section .math-point { margin-bottom: 16px; padding: 16px; background: #fafafa; border-radius: 8px; border: 1px solid var(--border); }
    .math-section .math-point .mp-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .math-section .math-point .mp-tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .math-section .math-point .mp-tag.trap { background: #fee2e2; color: #dc2626; }
    .math-section .math-point .mp-tag.knowledge { background: #dbeafe; color: #2563eb; }
    .math-section .math-point .mp-tag.method { background: #dcfce7; color: #16a34a; }
    .math-section .math-point .mp-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .math-section .math-point .mp-body { font-size: 0.9rem; color: var(--text-muted); line-height: 1.8; }
    .math-section .math-point .mp-body code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.8rem; color: #334155; }
    .math-section .math-point .mp-conclusion { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border-left: 3px solid; }
    .math-section .math-point .mp-conclusion.trap { background: #fef2f2; color: #991b1b; border-color: #dc2626; }
    .math-section .math-point .mp-conclusion.knowledge { background: #eff6ff; color: #1e40af; border-color: #2563eb; }
    .math-section .math-point .mp-conclusion.method { background: #f0fdf4; color: #14532d; border-color: #16a34a; }

    .divider { height: 2px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 32px 0; border: none; }
    footer { text-align: center; padding: 24px; font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.85rem;
      box-shadow: var(--shadow-hover); z-index: 1000; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); width: var(--sidebar-width) !important; }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed { width: var(--sidebar-width) !important; }
      .sidebar.collapsed .sidebar-body { display: block; }
      .sidebar-toggle { display: none; }
      .main { margin-left: 0 !important; }
      .main.expanded { margin-left: 0 !important; }
      .topbar { display: flex; }
      .overlay.show { display: block; }
    }
    @media (max-width: 600px) {
      .main { padding: 12px; }
      header { padding: 28px 16px; } header h1 { font-size: 1.4rem; }
      .card { padding: 20px; }
      .english-section .sentence-box { font-size: 0.9rem; padding: 14px; }
    }

    /* ========== Flashcard Styles ========== */
    .fc-section { margin-top: 16px; }
    .fc-viewport { perspective: 1200px; margin: 16px auto; cursor: pointer; }
    .fc-card { position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; }
    .fc-card.flipped { transform: rotateY(180deg); }
    .fc-face { grid-area: card; backface-visibility: hidden; border-radius: 12px; padding: 28px;
      display: flex; flex-direction: column; justify-content: center; }
    .fc-front { background: linear-gradient(135deg, #f8fafc, #f1f5f9); border: 2px solid var(--border); }
    .fc-back { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 2px solid #bbf7d0;
      transform: rotateY(180deg); overflow-y: auto; max-height: 500px; }
    .fc-label { font-size: 0.78em; color: var(--text-muted); text-align: center; margin-bottom: 8px; }
    .fc-question { font-size: 1.05em; line-height: 1.75; text-align: center; margin: 16px 0; color: var(--text); }
    .fc-hint { text-align: center; color: #aaa; font-size: 0.78em; margin-top: auto; padding-top: 12px; }
    .fc-answer { font-size: 0.9em; line-height: 1.8; color: #14532d; }
    .fc-answer .note-link { margin-top: 10px; font-size: 0.8rem; color: #14532d; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .fc-answer .note-link a { color: #14532d; text-decoration: underline; }
    .fc-controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
    .fc-controls button { background: white; border: 1px solid var(--border); color: var(--text); padding: 7px 18px;
      border-radius: 8px; cursor: pointer; font-size: 0.85em; font-family: inherit; transition: all 0.15s; }
    .fc-controls button:hover { border-color: var(--accent); color: var(--accent); }
    .fc-counter { text-align: center; font-size: 0.85em; color: var(--text-muted); min-width: 60px; }
    .fc-mark { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    .fc-mark button { padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.82em;
      border: 1px solid; background: transparent; font-family: inherit; transition: all 0.15s; }
    .fc-m-ok { border-color: var(--accent-green) !important; color: var(--accent-green); }
    .fc-m-ok:hover, .fc-m-ok.active { background: #dcfce7; }
    .fc-m-no { border-color: var(--accent-amber) !important; color: var(--accent-amber); }
    .fc-m-no:hover, .fc-m-no.active { background: #fef3c7; }
    .fc-progress { text-align: center; font-size: 0.78em; color: #aaa; margin-top: 6px; }
    .fc-shortcut { text-align: center; font-size: 0.72em; color: #bbb; margin-top: 10px; }

    /* ========== Flashcard Tabs ========== */
    .fc-tabs-wrap { margin-bottom: 12px; }
    .fc-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
    .fc-tab { background: white; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 18px;
      border-radius: 20px; cursor: pointer; font-size: 0.85em; font-family: inherit; transition: all 0.15s; }
    .fc-tab:hover { border-color: var(--accent); color: var(--accent); }
    .fc-tab.active { border-color: var(--accent); color: white; background: var(--accent); }
    .fc-tab-badge { font-size: 0.75em; opacity: 0.7; margin-left: 4px; }

  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📋</div>
        <span>早间复习</span>
      </div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="收起/展开">◀</button>

          translation: "然而，我们熟知的报纸评论文化之所以在赞美上如此慷慨、在标准上如此毫不妥协，是有根本原因的——其中最重要的一个简单事实是：这些评论家们成长于一个将文学视为天职而非职业的时代，他们带着一种信念和学识来写作，而这种信念和学识本身就是一种权威。",
          structure: `[Yet there are fundamental reasons],  ← 主句：there be 句型
    why the culture... was so... and so...  ← why 引导定语从句，修饰 reasons
        └── [as we knew it]  ← 插入语，修饰 the culture
        └── [not least of which] was the simple fact...  ← 非限制性定语从句，which 指代 reasons
            └── that the critics... wrote with a conviction and a learning...  ← 同位语从句，解释 fact
                └── [having been educated in an era...]  ← 现在分词完成被动，作 critics 的伴随状语
                    └── when literature was regarded as...  ← when 引导定语从句，修饰 era
                └── [rather than a profession]  ← 并列结构
                └── that was itself a form of authority  ← 定语从句，修饰 conviction and learning`,
          words: [
            { word: "lavish", meaning: "慷慨的、大量的", familiar: "浪费的、奢侈的" },
            { word: "uncompromising", meaning: "严格的、毫不让步的", familiar: "不妥协的" },
            { word: "calling", meaning: "天职、使命", familiar: "呼叫" },
            { word: "conviction", meaning: "坚定的信念", familiar: "定罪、信念" },
            { word: "authority", meaning: "说服力、权威感", familiar: "权威、权力" },
            { word: "not least of which", meaning: "其中尤为重要的", familiar: "—" }
          ],
          grammar: [
            { title: "why 引导定语从句", body: "<code>reasons why...</code> 中 why 引导定语从句修饰 reasons，why 在从句中作原因状语。<code>the reason why... is that...</code> 是经典句型。" },
            { title: "as we knew it 插入语", body: "<code>the culture... as we knew it</code> = '我们熟知的……文化'，as 引导方式状语从句的省略形式。类似表达：the world as we know it（我们所知的世界）。" },
            { title: "not least of which 非限制性定语从句", body: "= '其中尤为重要的（一个）'，which 指代前面的 reasons。least 在此不是'最少'，而是 not least = '尤其、相当'。" },
            { title: "having been educated 现在分词完成被动", body: "表示'在被教育之后'的动作先于主句动作（wrote），且 critics 与 educate 是被动关系。= after they had been educated。" },
            { title: "when 引导定语从句 vs 时间状语从句", body: "<code>an era when literature was...</code> 中 when 修饰 era（名词），是定语从句；若 when 前面没有先行词，则是时间状语从句。" },
            { title: "rather than 的并列结构", body: "<code>a calling rather than a profession</code> = '天职而非职业'。rather than 连接并列成分，前后词性/形式应一致。" },
            { title: "that 引导定语从句修饰两个并列名词", body: "<code>a conviction and a learning that was...</code> 中 that 从句修饰 conviction 和 learning 两者，谓语用单数 was（把两者视为一个整体概念）。" }
          ],
          noteLink: { name: "长难句笔记.md", path: "C:/Users/92534/Desktop/考研/English/grammar/长难句笔记.md" }
        }

        english: {

          sentence: `The assertion <span class="hl-blue">that</span> the rapid proliferation of artificial intelligence will inevitably <span class="hl-red">augment</span> human capabilities <span class="hl-blue">rather than</span> <span class="hl-red">supplant</span> them <span class="hl-amber">rests on</span> the assumption <span class="hl-blue">that</span> the technologies <span class="hl-blue">in question</span> can be deployed in a manner <span class="hl-blue">that</span> preserves human <span class="hl-red">agency</span>, an assumption <span class="hl-blue">that</span> is itself <span class="hl-amber">contingent upon</span> the willingness of those <span class="hl-blue">who</span> control these systems <span class="hl-blue">to prioritize</span> transparency and accountability over the <span class="hl-red">relentless</span> <span class="hl-red">pursuit</span> of efficiency and profit.`,

    function updateCheckinUI() {
      const btn = document.getElementById('checkin-btn');
      const checked = isCheckedIn(currentDate);
      btn.classList.toggle('checked', checked);
      btn.textContent = checked ? '✅ 已打卡（点击取消）' : '✅ 今日打卡';
      // 计算连续和累计
      const dates = getCheckinData().slice().sort();
      const studied = Object.keys(dailyData).filter(d => dailyData[d].studied);
      const allDates = [...new Set([...dates, ...studied])].sort();
      let streak = 0, total = allDates.length;
      const today = currentDate;
      for (let i = allDates.length - 1; i >= 0; i--) {
        const d = new Date(allDates[i]);
        const expected = new Date(today);
        expected.setDate(expected.getDate() - (allDates.length - 1 - i));
        if (d.toISOString().split('T')[0] === expected.toISOString().split('T')[0]) streak++;
        else break;
      }
      document.getElementById('streak').textContent = streak;
      document.getElementById('total').textContent = total;
    }

    // ========================
    // CALENDAR
    // ========================
    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const prevDays = new Date(calYear, calMonth, 0).getDate();
      document.getElementById('cal-month').textContent = calYear + '年' + (calMonth + 1) + '月';
      const checkins = getCheckinData();
      const studiedDates = Object.keys(dailyData).filter(d => dailyData[d].studied);
      let html = '';
      const weekdays = ['日','一','二','三','四','五','六'];
      weekdays.forEach(w => { html += '<div class="cal-cell other" style="cursor:default;">' + w + '</div>'; });
      for (let i = firstDay - 1; i >= 0; i--) {
        html += '<div class="cal-cell other">' + (prevDays - i) + '</div>';
      }
      const today = new Date().toISOString().split('T')[0];
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        let cls = 'cal-cell';
        if (dateStr === today) cls += ' today';
        if (studiedDates.includes(dateStr)) cls += ' studied';
        if (checkins.includes(dateStr)) cls += ' checked';
        html += '<div class="' + cls + '" onclick="switchDate(\'' + dateStr + '\')">' + d + '</div>';
      }
      const rem = (7 - ((firstDay + daysInMonth) % 7)) % 7;
      for (let i = 1; i <= rem; i++) {
        html += '<div class="cal-cell other">' + i + '</div>';
      }
      grid.innerHTML = html;
    }
    function changeMonth(delta) {

      if (calMonth < 0) { calMonth = 11; calYear--; }

    }

    function copyPath(path) {

    // ========================
    // FLASHCARD ENGINE v2 (Spaced Repetition)
    // ========================
    var FC_INTERVALS = [1, 2, 4, 7, 15, 30];
    var fcActive = null;  // active subject tab
    var fcQueue = {};     // { subject: [card_objects] }
    var fcIdx = {};       // { subject: current_index }
    var fcFlipped = {};   // { subject: bool }
    var fcSR = {};        // spaced rep state from localStorage

    function dayNum(d) { return Math.floor(new Date(d+'T00:00:00').getTime() / 86400000); }

    function loadSR() {
      try { fcSR = JSON.parse(localStorage.getItem('mr_sr') || '{}'); }
      catch(e) { fcSR = {}; }
    }
    function saveSR() {
      try { localStorage.setItem('mr_sr', JSON.stringify(fcSR)); } catch(e){}
    }
    function ensureSR(id) {
      if (!fcSR[id]) fcSR[id] = { step: -1, nextDue: '', mastered: false };
      return fcSR[id];
    }

    function buildQueue(subject) {
      var today = currentDate;
      var cards = FC_LIB.cards.filter(function(c){ return c.subject === subject; });
      var dayInCycle = dayNum(today) - dayNum(FC_LIB.startDate) + 1;

      var newCards = cards.filter(function(c) {
        return c.day <= dayInCycle && !fcSR[c.id] && !ensureSR(c.id).mastered;
      });

      var reviewCards = cards.filter(function(c) {
        var sr = fcSR[c.id];
        return sr && !sr.mastered && sr.step >= 0 && sr.nextDue <= today;
      }).sort(function(a, b) {
        var sa = fcSR[a.id], sb = fcSR[b.id];
        if (sa.nextDue < sb.nextDue) return -1;
        if (sa.nextDue > sb.nextDue) return 1;
        return sa.step - sb.step;
      }).slice(0, 10);

      return { newCards: newCards, reviewCards: reviewCards,
               all: reviewCards.concat(newCards) };
    }

    function renderTabs() {
      var subs = ['408', 'math', 'politics'];
      var labels = { '408': '408', 'math': '\u6570\u5b66', 'politics': '\u653f\u6cbb' };
      var html = '<div class="fc-tabs">';
      subs.forEach(function(s) {
        var q = fcQueue[s] || { newCards:[], reviewCards:[], all:[] };
        var cnt = q.all.length;
        var rev = q.reviewCards.length;
        var active = fcActive === s ? ' active' : '';
        var badge = cnt > 0 ? ' <span class="fc-tab-badge">' + rev + '+' + (cnt - rev) + '</span>' : '';
        html += '<button class="fc-tab' + active + '" onclick="switchTab(\'' + s + '\')">' +
                labels[s] + badge + '</button>';
      });
      html += '</div>';
      return html;
    }

    function renderFC(sec) {
      var q = fcQueue[sec];
      var container = document.getElementById('fc-' + sec);
      if (!container) return;
      if (!q || q.all.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;font-size:0.9em">' +
          (sec === 'politics' ? '\u653f\u6cbb\u8d44\u6599\u5f85\u5bfc\u5165\uff0c\u653e\u5165\u7b14\u8bb0\u540e\u81ea\u52a8\u751f\u6210\u95ea\u5361' :
           '\u4eca\u65e5\u65e0\u65b0\u5361\uff0c\u660e\u5929\u7ee7\u7eed') + '</div>';
        return;
      }
      var s_idx = fcIdx[sec] || 0;
      if (s_idx >= q.all.length) s_idx = q.all.length - 1;
      var c = q.all[s_idx];
      var sr = ensureSR(c.id);
      var isFlipped = fcFlipped[sec] || false;
      var isRev = sr.step >= 0;
      var label = (isRev ? '\u590d\u4e60\u00b7' : '\u65b0\u5361\u00b7') + c.topic;

      var aHtml = c.a.replace(/\n/g, '<br>');
      var card = '<div class="fc-viewport" onclick="fcFlip()">' +
        '<div class="fc-card' + (isFlipped ? ' flipped' : '') + '">' +
        '<div class="fc-face fc-front">' +
        '<div class="fc-label">' + label + '</div>' +
        '<div class="fc-question">' + c.q + '</div>' +
        '<div class="fc-hint">\u6309\u7a7a\u683c\u7ffb\u8f6c\u67e5\u770b\u7b54\u6848</div></div>' +
        '<div class="fc-face fc-back">' +
        '<div class="fc-label">\u53c2\u8003\u7b54\u6848' + (isRev ? ' (step ' + (sr.step + 1) + '/' + FC_INTERVALS.length + ')' : '') + '</div>' +
        '<div class="fc-answer">' + aHtml + '</div>' +
        '<div class="fc-hint" style="color:#888">1=\u5df2\u638c\u63e1 2=\u5f85\u5de9\u56fa \u7a7a\u683c=\u4e0b\u4e00\u9898</div></div>' +
        '</div></div>';

      var ctrl = '<div class="fc-controls">' +
        '<button onclick="event.stopPropagation();fcPrev(\'' + sec + '\')">\u2190 \u4e0a\u4e00\u9898</button>' +
        '<span class="fc-counter">' + (s_idx + 1) + ' / ' + q.all.length + '</span>' +
        '<button onclick="event.stopPropagation();fcNext(\'' + sec + '\')">\u4e0b\u4e00\u9898 \u2192</button></div>';

      var mark = '<div class="fc-mark">' +
        '<button class="fc-m-ok' + (sr.mastered ? ' active' : '') + '" onclick="event.stopPropagation();fcMark(\'' + sec + '\',\'ok\')">\u2705 \u5df2\u638c\u63e1</button>' +
        '<button class="fc-m-no' + (!sr.mastered && sr.step >= 0 ? ' active' : '') + '" onclick="event.stopPropagation();fcMark(\'' + sec + '\',\'no\')">\ud83d\udd04 \u5f85\u5de9\u56fa</button></div>';

      var total = q.all.length, rev = q.reviewCards.length, nw = q.newCards.length;
      var prog = '<div class="fc-progress">\u65b0\u5361 ' + nw + ' | \u590d\u4e60 ' + rev + ' | \u5171 ' + total + '</div>';
      var hint = '<div class="fc-shortcut">\u7a7a\u683c\uff1a\u7ffb\u8f6c/\u4e0b\u4e00\u9898 | \u2190\u2192\uff1a\u7ffb\u9875 | 1/2\uff1a\u638c\u63e1/\u5de9\u56fa</div>';

      container.innerHTML = card + ctrl + mark + prog + hint;

      var vp = container.querySelector('.fc-viewport');
      var cardEl = container.querySelector('.fc-card');
      if (vp && cardEl) {
        var face = isFlipped ? cardEl.querySelector('.fc-back') : cardEl.querySelector('.fc-front');
        if (face) vp.style.minHeight = face.offsetHeight + 'px';
      }
    }

    function switchTab(sec) {
      fcActive = sec;
      document.querySelectorAll('.fc-tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.fc-tab').forEach(function(t) {
        if (t.textContent.indexOf(sec === '408' ? '408' : sec === 'math' ? '\u6570\u5b66' : '\u653f\u6cbb') >= 0) t.classList.add('active');
      });
      ['408', 'math', 'politics'].forEach(function(s) {
        var el = document.getElementById('fc-' + s);
        if (el) el.parentElement.style.display = s === sec ? '' : 'none';
      });
      if (!fcIdx[sec]) fcIdx[sec] = 0;
      fcFlipped[sec] = false;
      renderFC(sec);
    }

    function fcFlip() {
      if (!fcActive) return;
      fcFlipped[fcActive] = !fcFlipped[fcActive];
      renderFC(fcActive);
    }
    function fcNext(sec) {
      var q = fcQueue[sec];
      if (!q) return;
      if ((fcIdx[sec] || 0) < q.all.length - 1) {
        fcIdx[sec] = (fcIdx[sec] || 0) + 1;
        fcFlipped[sec] = false;
        renderFC(sec);
      }
    }
    function fcPrev(sec) {
      if ((fcIdx[sec] || 0) > 0) {
        fcIdx[sec] = (fcIdx[sec] || 0) - 1;
        fcFlipped[sec] = false;
        renderFC(sec);
      }
    }

    function fcMark(sec, type) {
      var q = fcQueue[sec];
      if (!q || !q.all.length) return;
      var c = q.all[fcIdx[sec] || 0];
      var sr = ensureSR(c.id);
      var today = currentDate;

      if (type === 'ok') {
        sr.mastered = true;
        showToast('\u2705 \u5df2\u638c\u63e1\uff01');
      } else {
        sr.mastered = false;
        sr.step = Math.max(0, sr.step + 1);
        if (sr.step >= FC_INTERVALS.length) {
          sr.step = FC_INTERVALS.length - 1;
          showToast('\ud83d\udcaa \u987d\u56fa\u5361\uff0c\u6bcf\u65e5\u590d\u4e60');
        }
        var nextDay = new Date(today + 'T00:00:00');
        nextDay.setDate(nextDay.getDate() + FC_INTERVALS[Math.min(sr.step, FC_INTERVALS.length - 1)]);
        sr.nextDue = nextDay.toISOString().split('T')[0];
        showToast('\ud83d\udd04 \u4e0b\u6b21\u590d\u4e60: ' + sr.nextDue);
      }
      saveSR();
      // Rebuild queue (card may have been mastered)
      ['408', 'math', 'politics'].forEach(function(s) {
        fcQueue[s] = buildQueue(s);
      });
      renderTabsAndCards();
    }

    function renderTabsAndCards() {
      var sec = document.getElementById('sec-quiz');
      if (!sec) return;
      var tabsHtml = renderTabs();
      sec.querySelector('.fc-tabs-wrap').innerHTML = tabsHtml;
      if (fcActive) renderFC(fcActive);
    }

    function fcInit() {
      loadSR();
      ['408', 'math', 'politics'].forEach(function(s) {
        fcQueue[s] = buildQueue(s);
        fcIdx[s] = 0;
        fcFlipped[s] = false;
      });
      // Auto-select first subject with cards
      fcActive = null;
      ['408', 'math', 'politics'].forEach(function(s) {
        if (!fcActive && fcQueue[s].all.length > 0) fcActive = s;
      });
      if (!fcActive) fcActive = '408';
    }

    document.addEventListener('keydown', function(e) {
      if (!fcActive || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      var q = fcQueue[fcActive];
      if (!q || !q.all.length) return;
      if (e.code === 'Space') { e.preventDefault(); if (fcFlipped[fcActive]) fcNext(fcActive); else fcFlip(); return; }
      if (e.key === 'ArrowRight' || e.key === 'j') { fcNext(fcActive); return; }
      if (e.key === 'ArrowLeft' || e.key === 'k') { fcPrev(fcActive); return; }
      if (fcFlipped[fcActive] && e.key === '1') { fcMark(fcActive, 'ok'); return; }
      if (fcFlipped[fcActive] && e.key === '2') { fcMark(fcActive, 'no'); return; }
      // Tab switching with T key
      if (e.key === 't' || e.key === 'T') {
        var subs = ['408', 'math', 'politics'];
        var i = subs.indexOf(fcActive);
        switchTab(subs[(i + 1) % subs.length]);
      }
    });
    // Initialize
    renderAll();
    renderCalendar();
    renderHistory();
  </script>
